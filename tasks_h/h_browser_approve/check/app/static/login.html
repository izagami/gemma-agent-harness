<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ログイン - 購買申請 承認</title>
<style>body{font-family:sans-serif;margin:40px}label{display:block;margin:8px 0}#msg{color:#c00}</style></head><body>
<h1>購買申請 承認 ログイン</h1>
<label>ユーザー名 <input id="user" autocomplete="username"></label>
<label>パスワード <input id="password" type="password" autocomplete="current-password"></label>
<button id="login">ログイン</button> <span id="msg"></span>
<script>
document.querySelector('#login').onclick = async () => {
  document.querySelector('#msg').textContent = '';
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: document.querySelector('#user').value, password: document.querySelector('#password').value})});
  const d = await r.json();
  if (d.ok) location.href = '/requests'; else document.querySelector('#msg').textContent = d.error;
};
</script></body></html>
