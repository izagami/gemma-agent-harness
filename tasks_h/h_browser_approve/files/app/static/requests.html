<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>購買申請の承認</title>
<style>
body{font-family:sans-serif;margin:24px}
input[type=search]{width:320px;padding:4px}
table{border-collapse:collapse;margin-top:10px;min-width:760px}
td,th{border:1px solid #bbb;padding:4px 8px}
td.amount{text-align:right}
table[aria-busy=true]{opacity:.5}
.searching{color:#666;margin-left:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.overlay[hidden]{display:none}
[role=dialog]{background:#fff;padding:18px 22px;min-width:380px;border-radius:6px}
[role=dialog] textarea{width:100%;height:70px}
.toast{position:fixed;right:20px;bottom:20px;background:#253;color:#fff;padding:10px 16px;border-radius:4px}
.toast.err{background:#a22}
</style></head><body>
<h1>購買申請の承認</h1>
<p>
  <input type="search" aria-label="申請番号・件名で検索" placeholder="申請番号・件名で検索">
  <span class="searching" hidden>検索中…</span>
</p>
<p class="summary"></p>
<table data-testid="req-table" aria-busy="false">
  <thead><tr><th>申請番号</th><th>件名</th><th>申請者</th><th>金額</th><th>状態</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<div class="overlay" hidden>
  <div role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title">承認</h2>
    <p class="dlg-target"></p>
    <label>承認コメント<br><textarea aria-label="承認コメント"></textarea></label>
    <p><button type="button" class="btn-primary">承認する</button> <button type="button" class="btn-cancel">キャンセル</button></p>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const box = $('input[type=search]'), table = $('[data-testid=req-table]'), tbody = $('tbody');
const overlay = $('.overlay');
let seq = 0, timer = null, current = null;

function toast(text, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.setAttribute('role', 'status');
  t.dataset.testid = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}

function render(items, total, q) {
  tbody.innerHTML = '';
  for (const r of items) {
    const tr = document.createElement('tr');
    tr.setAttribute('data-testid', 'req-row');
    const cells = [r.no, r.title, r.applicant, Number(r.amount).toLocaleString('ja-JP') + ' 円', r.status];
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 3) td.className = 'amount';
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    if (r.status === '申請中') {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = '承認';
      b.setAttribute('aria-label', `${r.no} を承認`);
      b.addEventListener('click', () => openDialog(r, tr));
      td.appendChild(b);
    }
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
  $('.summary').textContent = total > items.length ? `${total} 件中 ${items.length} 件を表示` : `${total} 件`;
}

async function search() {
  const my = ++seq, q = box.value.trim();
  table.setAttribute('aria-busy', 'true');
  $('.searching').hidden = false;
  const r = await fetch('/api/requests?q=' + encodeURIComponent(q));
  if (r.status === 401) { location.href = '/login'; return; }
  const d = await r.json();
  if (my !== seq) return;                   // a newer search was started meanwhile
  render(d.items, d.total, q);
  table.dataset.query = q;
  table.setAttribute('aria-busy', 'false');
  $('.searching').hidden = true;
}

// search as you type (300 ms after the last key); the previous result stays on screen until the new one arrives
box.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 300); });

function openDialog(r, tr) {
  current = {r, tr};
  $('.dlg-target').textContent = `${r.no} ${r.title}(${r.applicant})`;
  $('[role=dialog] textarea').value = '';
  overlay.hidden = false;
}

$('.btn-cancel').addEventListener('click', () => { overlay.hidden = true; current = null; });

$('.btn-primary').addEventListener('click', async () => {
  if (!current) return;
  const {r, tr} = current;
  if (!confirm(`${r.no} を承認します。よろしいですか?`)) return;
  const res = await fetch('/api/approve', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({no: r.no, comment: $('[role=dialog] textarea').value})});
  const d = await res.json();
  overlay.hidden = true;
  current = null;
  if (d.ok) {
    tr.children[4].textContent = '承認済';
    tr.children[5].innerHTML = '';
    toast(`${r.no} を承認しました`);
  } else {
    toast(d.error || '承認できませんでした', true);
  }
});

search();
</script></body></html>
