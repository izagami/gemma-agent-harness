<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ログイン - 在庫照会</title>
<style>body{font-family:sans-serif;margin:40px}label{display:block;margin:8px 0}.msg{color:#c00}</style></head><body>
<h1>在庫照会 ログイン</h1>
<form class="login">
<label>ユーザー名 <input name="u" aria-label="ユーザー名" autocomplete="username"></label>
<label>パスワード <input name="p" type="password" aria-label="パスワード" autocomplete="current-password"></label>
<button type="submit">ログイン</button> <span class="msg" role="alert"></span>
</form>
<script>
document.querySelector('form.login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target, msg = document.querySelector('.msg');
  msg.textContent = '';
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user: f.u.value, password: f.p.value})});
  const d = await r.json();
  if (d.ok) location.href = '/stock'; else msg.textContent = d.error;
});
</script></body></html>
