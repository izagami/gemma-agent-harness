<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>在庫照会</title>
<style>
body{font-family:sans-serif;margin:24px}
[role=tablist]{display:flex;gap:4px;margin:12px 0}
[role=tab]{padding:6px 14px;border:1px solid #888;background:#eee;cursor:pointer}
[role=tab][aria-selected=true]{background:#246;color:#fff}
table{border-collapse:collapse;margin-top:8px;min-width:640px}
td,th{border:1px solid #bbb;padding:4px 8px}
td.qty{text-align:right}
td.neg{color:#c00}
table[aria-busy=true]{opacity:.55}
.bar{display:flex;gap:16px;align-items:center}
</style></head><body>
<h1>在庫照会</h1>
<div role="tablist" aria-label="倉庫"></div>
<div class="bar">
  <label><input type="checkbox" data-testid="instock-only" checked> 在庫ありのみ表示</label>
  <span data-testid="count"></span>
</div>
<table data-testid="stock-table" aria-busy="true">
  <thead><tr><th>棚番</th><th>SKU</th><th>品名</th><th>在庫数</th></tr></thead>
  <tbody></tbody>
</table>
<p><button type="button" data-testid="load-more" hidden>さらに表示</button></p>
<script>
const PAGE = 20;
const st = {wh: null, total: 0, seq: 0};
const $ = (s) => document.querySelector(s);
const tbody = $('tbody'), table = $('[data-testid=stock-table]'), more = $('[data-testid=load-more]');

function fmtQty(n) {
  const s = Math.abs(n).toLocaleString('ja-JP');
  return n < 0 ? '▲' + s : s;
}

function rowEl(it) {
  const tr = document.createElement('tr');
  tr.setAttribute('data-testid', 'stock-row');
  for (const [col, val] of [['loc', it.loc], ['sku', it.sku], ['name', it.name], ['qty', fmtQty(it.qty)]]) {
    const td = document.createElement('td');
    td.dataset.col = col;
    td.textContent = val;
    if (col === 'qty') { td.className = 'qty' + (it.qty < 0 ? ' neg' : ''); }
    tr.appendChild(td);
  }
  return tr;
}

async function fetchPage(offset) {
  const inst = $('[data-testid=instock-only]').checked ? 1 : 0;
  const r = await fetch(`/api/stock?wh=${encodeURIComponent(st.wh)}&offset=${offset}&limit=${PAGE}&instock=${inst}`);
  if (r.status === 401) { location.href = '/login'; return null; }
  return r.json();
}

function updateFooter() {
  const shown = tbody.querySelectorAll('[data-testid=stock-row]').length;
  $('[data-testid=count]').textContent = `表示中 ${shown} / 全 ${st.total} 件`;
  more.hidden = shown >= st.total;
}

// reload the table for the current warehouse / filter. The old rows stay on screen until the new data arrives.
async function reload() {
  const my = ++st.seq;
  table.setAttribute('aria-busy', 'true');
  const d = await fetchPage(0);
  if (!d || my !== st.seq) return;          // a newer reload was started meanwhile
  tbody.innerHTML = '';
  st.total = d.total;
  if (d.items.length === 0) {
    tbody.innerHTML = '<tr class="empty"><td colspan="4">該当する在庫はありません</td></tr>';
  }
  d.items.forEach((it) => tbody.appendChild(rowEl(it)));
  table.dataset.wh = st.wh;
  table.setAttribute('aria-busy', 'false');
  updateFooter();
}

more.addEventListener('click', async () => {
  const my = st.seq;
  const offset = tbody.querySelectorAll('[data-testid=stock-row]').length;
  table.setAttribute('aria-busy', 'true');
  const d = await fetchPage(offset);
  if (!d || my !== st.seq) return;
  d.items.forEach((it) => tbody.appendChild(rowEl(it)));
  st.total = d.total;
  table.setAttribute('aria-busy', 'false');
  updateFooter();
});

$('[data-testid=instock-only]').addEventListener('change', reload);

function selectTab(btn) {
  document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
  st.wh = btn.dataset.wh;
  reload();
}

(async () => {
  const r = await fetch('/api/warehouses');
  if (r.status === 401) { location.href = '/login'; return; }
  const whs = await r.json();
  const list = $('[role=tablist]');
  whs.forEach((w) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', 'false');
    b.dataset.wh = w.code;
    b.textContent = `${w.name} (${w.code})`;
    b.addEventListener('click', () => selectTab(b));
    list.appendChild(b);
  });
  if (whs.length) selectTab(list.querySelector('[role=tab]'));
})();
</script></body></html>
